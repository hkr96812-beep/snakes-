<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Desert Knight - WebGL</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="glCanvas"></canvas>
  <div id="hud">
    <div class="topbar">
      <b>⚔️ فارس الصحراء</b>
      <span id="day">اليوم 1</span>
      <span id="gold">💰 2000</span>
      <span id="morale">❤️ 100</span>
    </div>
    <div id="log"></div>
    <div id="panel" class="panel hidden"></div>
    <div id="controls">
      <div class="dpad">
        <button data-dir="up">▲</button><div><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div>
      </div>
      <div class="actions"><button id="save">حفظ</button><button id="load">تحميل</button><button id="endBattle" class="hidden">عودة للخريطة</button></div>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
